<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">

  <title>🌌 J.A.R. 黑洞 3D | JAR Black Hole - General Relativity Simulator</title>
  <meta name="description" content="J.A.R. 廣義相對論實時 3D 黑洞天體物理模擬器，具備 GPGPU 吸積盤、光子環與 3D HRTF 空間音效。">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./jarBlackHole192icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./jarBlackHole512icon.png">

  <!-- CSP 安全防護政策 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 深空動態星雲背景 -->
  <div id="starfield-bg" aria-hidden="true"></div>

  <!-- 3D 畫布容器 -->
  <main id="canvas-container" role="main"></main>

  <!-- 3A 駕駛艙 HUD 面板 -->
  <aside id="ui-panel" aria-label="黑洞全息控制終端">
    <!-- 頂部狀態與語言列 -->
    <div class="hud-top-bar">
      <div class="sys-status">
        <span class="status-dot"></span>
        <span class="status-text">SYSTEM ONLINE</span>
      </div>
      <nav class="lang-switcher" aria-label="切換語言">
        <button id="btn-zh" class="lang-btn active" type="button">繁中</button>
        <button id="btn-en" class="lang-btn" type="button">EN</button>
      </nav>
    </div>

    <!-- 品牌全息標題 -->
    <header class="hud-header">
      <h1 id="ui-title">J.A.R. 黑洞 3D</h1>
      <h2 id="ui-subtitle">廣義相對論實時遙測系統</h2>
      <p id="ui-desc">觀測極限重力透鏡、時間膨脹與都卜勒聚束效應。</p>
    </header>

    <!-- 任務目標指示 HUD -->
    <div class="mission-hud" role="status" aria-live="polite">
      <span class="mission-badge">OBJECTIVE</span>
      <div id="missionText" class="mission-text">任務一：光子球軌道標定 (調整質量至 3.5 M☉)</div>
    </div>

    <!-- 遙測數據大字看板 (大字階層) -->
    <section class="telemetry-grid" aria-label="核心物理數據">
      <div class="telemetry-box">
        <span class="telemetry-label" id="label-isco">ISCO 最內穩定軌道</span>
        <span class="telemetry-val cyan-val" id="iscoVal">15.0 <small>Rs</small></span>
      </div>
      <div class="telemetry-box">
        <span class="telemetry-label" id="label-photon">光子球臨界半徑</span>
        <span class="telemetry-val purple-val" id="photonVal">7.5 <small>Rs</small></span>
      </div>
    </section>

    <!-- 控制滑塊群組 -->
    <section class="controls-wrapper" aria-label="物理與渲染參數調節">
      <div class="control-group">
        <div class="control-header">
          <label for="massRange" id="label-mass">黑洞引力質量</label>
          <span id="massVal" class="val-badge purple-badge">2.5 M☉</span>
        </div>
        <input type="range" id="massRange" min="1.0" max="5.0" step="0.1" value="2.5">
      </div>

      <div class="control-group">
        <div class="control-header">
          <label for="speedRange" id="label-speed">吸積盤自轉速度</label>
          <span id="speedVal" class="val-badge cyan-badge">1.0 c</span>
        </div>
        <input type="range" id="speedRange" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <div class="control-header">
          <label for="bloomRange" id="label-bloom">光子球發光強度</label>
          <span id="bloomVal" class="val-badge orange-badge">1.6</span>
        </div>
        <input type="range" id="bloomRange" min="0.0" max="3.5" step="0.1" value="1.6">
      </div>

      <!-- 脈衝發射按鈕 -->
      <button id="launchBtn" type="button" aria-label="發射探測器觀測意粉化">
        <div class="btn-glow"></div>
        <span id="btn-launch-text">🚀 發射探測器 (意粉化遙測)</span>
      </button>
    </section>

    <footer class="hud-footer">
      <div class="stat-row note" id="ui-note">
        * 當粒子穿越 ISCO 後，軌道失去穩定性直墜事件視界。
      </div>
    </footer>
  </aside>

  <!-- Three.js CDN 核心依賴 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <!-- 業務引擎 -->
  <script src="js/i18n.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/shaders.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/probe.js"></script>
  <script src="js/main.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
