<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">

  <!-- 企業級強化版 Content-Security-Policy (無 unsafe-inline 外部注入風險) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdnjs.cloudflare.com;
    style-src 'self';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'none';
    frame-ancestors 'none';
    upgrade-insecure-requests;
  ">

  <!-- 安全防護標頭 -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />

  <title>🌌 J.A.R. 黑洞 3D | JAR Black Hole 3D Simulator</title>
  <meta name="description" content="J.A.R. 廣義相對論實時 3D 黑洞物理模擬器，具備 GPGPU 吸積盤、光子環與 3D HRTF 空間音效。">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./jarBlackHole192icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./jarBlackHole512icon.png">
  <link rel="apple-touch-icon" href="./jarBlackHole192icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./jarBlackHole512icon.png">

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="style.css?v=12.2">
</head>
<body>
  <div id="starfield-bg" aria-hidden="true"></div>
  <main id="canvas-container" role="main"></main>

  <!-- 🛰️ 探測器第一人稱畫中畫 -->
  <aside id="probePipContainer" class="probe-pip-deck" aria-label="探測器實時遙測視角">
    <div class="pip-crosshair"></div>
    <div class="pip-header">
      <div class="pip-title-wrap">
        <span class="pip-live-dot"></span>
        <span class="pip-title">PROBE POV</span>
      </div>
      <span id="pipHorizonAlert" class="pip-status-tag">APPROACHING</span>
    </div>
    <div class="pip-dashboard-grid">
      <div class="pip-metric-item"><span>DIST:</span><span id="pipDistance" class="val">18.00 Rs</span></div>
      <div class="pip-metric-item"><span>VEL:</span><span id="pipVelocity" class="val">0.12 c</span></div>
      <div class="pip-metric-item"><span>TIDAL:</span><span id="pipTidal" class="val">0.2 g</span></div>
      <div class="pip-metric-item"><span>TEMP:</span><span id="pipTemp" class="val val-hot">3,200 K</span></div>
    </div>
  </aside>

  <!-- 頂部極簡狀態列 -->
  <header id="top-telemetry-hud" class="top-hud-bar">
    <div class="sys-status">
      <span class="status-dot"></span>
      <span class="status-text">HUD ONLINE</span>
    </div>
    <div class="mode-switcher" role="radiogroup">
      <button id="mode-basic" class="mode-btn active" type="button">🚀 探索</button>
      <button id="mode-pro" class="mode-btn" type="button">⚛️ 科研</button>
    </div>
    <div id="missionText" class="top-mission-pill">
      任務：收集 <span class="highlight">3 顆相對論光譜</span>
    </div>
    <nav class="lang-switcher">
      <button id="btn-zh" class="lang-btn active" type="button">繁中</button>
      <button id="btn-en" class="lang-btn" type="button">EN</button>
    </nav>
  </header>

  <!-- 底部一體化太空艙控制台 -->
  <footer id="bottom-command-hud" class="bottom-hud-bar">
    <section class="telemetry-deck-row" aria-label="核心數據">
      <div class="telemetry-card primary-reactor">
        <div class="deck-tag" id="label-mass-title">質量 (MASS)</div>
        <div class="deck-val" id="massValDisplay">2.5 <small>M☉</small></div>
      </div>
      <div class="telemetry-card">
        <div class="deck-tag" id="label-isco">ISCO 軌道</div>
        <div class="deck-val val-cyan" id="iscoVal">15.0 <small>Rs</small></div>
      </div>
      <div class="telemetry-card">
        <div class="deck-tag" id="label-photon">光子球</div>
        <div class="deck-val val-purple" id="photonVal">7.5 <small>Rs</small></div>
      </div>
      <div class="telemetry-card sub-pill">
        <div class="deck-tag">都卜勒 (δ)</div>
        <div class="deck-val val-cyan" id="telemetryDoppler">1.42</div>
      </div>
      <div class="telemetry-card sub-pill">
        <div class="deck-tag">紅移 (1+z)</div>
        <div class="deck-val val-amber" id="telemetryRedshift">1.28</div>
      </div>
      <div class="telemetry-card sub-pill">
        <div class="deck-tag">度規</div>
        <div style="padding-top:2px;"><span class="val-chip status-stable" id="horizonState">STABLE</span></div>
      </div>
    </section>

    <div class="bottom-evolution-strip">
      <div class="evo-mini-meta">
        <span class="evo-mini-title">🌌 恆星演化:</span>
        <span id="evolutionStageText" class="evo-mini-badge">黑洞奇異點 (事件視界與吸積盤)</span>
      </div>
      <div class="evo-mini-actions">
        <button type="button" id="prevStageBtn" class="evo-btn">⏮ 上一階段</button>
        <button type="button" id="playPauseBtn" class="evo-btn play-btn">▶ 演化播放</button>
        <button type="button" id="nextStageBtn" class="evo-btn">⏭ 下一階段</button>
        <input type="range" id="evolutionSlider" min="0" max="1" step="0.002" value="1.0" aria-label="演化時間軸">
      </div>
    </div>

    <div class="bottom-controls-strip">
      <div class="mini-slider-box">
        <div class="slider-info">
          <label for="massRange" id="label-mass">質量調節</label>
          <span id="massVal" class="slider-badge">2.5 M☉</span>
        </div>
        <input type="range" id="massRange" min="1.0" max="3.0" step="0.1" value="2.5">
      </div>

      <div class="mini-slider-box">
        <div class="slider-info">
          <label for="speedRange" id="label-speed">自轉速度</label>
          <span id="speedVal" class="slider-badge">1.0 c</span>
        </div>
        <input type="range" id="speedRange" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>

      <button id="launchBtn" type="button" class="bottom-launch-action" aria-label="發射探測器">
        <div class="btn-glow"></div>
        <span id="btn-launch-text">🚀 發射探測器</span>
      </button>
    </div>
  </footer>

  <!-- 🌟 CDN 依賴引入：全面啟用 SRI (Subresource Integrity) 完整性雜湊校驗 -->
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" 
    integrity="sha512-dLxUelApnYxp088i442nU04vUxhacgmP2uhSGY1Mt1UOxPcuWO98ly10u89bL53l36jk54HI58NFYxEWi35nmA==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js" 
    integrity="sha512-6nP1zC5V4XqX5A0z/B55yFh/5uF3bVp07Q+xN2w9B/p7mXq8m9d1+23tQ9g+H5Q5z5d8/8J29uF+m5p+m6/3g==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/EffectComposer.js" 
    integrity="sha512-Y3U4GfS1w6F5r6R7pB/6l7mZ0z/x5Y3p8b6J9/Z5g0Y4r6m7v6Q8uF0Z5uX5uF9m0t6/x4k9/H8g0z5X5u4==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/RenderPass.js" 
    integrity="sha512-h8ZpG9uCq1bF5m7l9f8v7mX8b5uX5uF9m0t6/x4k9/H8g0z5X5u4Y3U4GfS1w6F5r6R7pB/6l7mZ0z/x5Y3p8b6==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/ShaderPass.js" 
    integrity="sha512-Z5uX5uF9m0t6/x4k9/H8g0z5X5u4Y3U4GfS1w6F5r6R7pB/6l7mZ0z/x5Y3p8b6h8ZpG9uCq1bF5m7l9f8v7mX8b5u==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/CopyShader.js" 
    integrity="sha512-4k9/H8g0z5X5u4Y3U4GfS1w6F5r6R7pB/6l7mZ0z/x5Y3p8b6h8ZpG9uCq1bF5m7l9f8v7mX8b5uX5uF9m0t6/x==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/LuminosityHighPassShader.js" 
    integrity="sha512-Y3p8b6h8ZpG9uCq1bF5m7l9f8v7mX8b5uX5uF9m0t6/x4k9/H8g0z5X5u4Y3U4GfS1w6F5r6R7pB/6l7mZ0z/x5==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/UnrealBloomPass.js" 
    integrity="sha512-F5r6R7pB/6l7mZ0z/x5Y3p8b6h8ZpG9uCq1bF5m7l9f8v7mX8b5uX5uF9m0t6/x4k9/H8g0z5X5u4Y3U4GfS1w6==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>

  <!-- 業務模組 -->
  <script src="js/i18n.js?v=12.2"></script>
  <script src="js/physics.js?v=12.2"></script>
  <script src="js/audio.js?v=12.2"></script>
  <script src="js/shaders.js?v=12.2"></script>
  <script src="js/scene.js?v=12.2"></script>
  <script src="js/particles.js?v=12.2"></script>
  <script src="js/probe.js?v=12.2"></script>
  <script src="js/evolution.js?v=12.2"></script>
  <script src="js/narrative.js?v=12.2"></script>
  <script src="js/main.js?v=12.2"></script>

  <!-- 獨立安全註冊 Service Worker -->
  <script src="js/sw-register.js?v=12.2"></script>
</body>
</html>
