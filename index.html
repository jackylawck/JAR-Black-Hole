<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">

  <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />

  <title>🌌 J.A.R. (Joint Applied Research) 黑洞 3D | JAR Black Hole - General Relativity Simulator</title>
  <meta name="description" content="J.A.R. 廣義相對論實時 3D 黑洞物理模擬器，具備 GPGPU 吸積盤、光子環與 3D HRTF 空間音效。">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./jarBlackHole192icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./jarBlackHole512icon.png">
  <link rel="apple-touch-icon" href="./jarBlackHole192icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./jarBlackHole512icon.png">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 深空背景 -->
  <div id="starfield-bg" aria-hidden="true"></div>

  <!-- 3D 渲染容器 -->
  <main id="canvas-container" role="main"></main>

  <!-- 3A 駕駛艙 HUD 主容器 -->
  <aside class="hud-main" id="ui-panel" aria-label="黑洞全息駕駛艙終端">
    <!-- 頂部狀態列 -->
    <div class="hud-top-row">
      <div class="hud-left-group">
        <div class="sys-status">
          <span class="status-dot"></span>
          <span class="status-text">COCKPIT HUD // ONLINE</span>
        </div>
        <div class="mode-switcher" role="radiogroup">
          <button id="mode-basic" class="mode-btn active" type="button">🚀 探索模式</button>
          <button id="mode-pro" class="mode-btn" type="button">⚛️ 科研模式</button>
        </div>
        <nav class="lang-switcher">
          <button id="btn-zh" class="lang-btn active" type="button">繁中</button>
          <button id="btn-en" class="lang-btn" type="button">EN</button>
        </nav>
      </div>

      <div class="hud-right-group">
        <div id="missionText" class="mission-text">
          任務：發射探測器收集 <span class="highlight">3 顆相對論光譜</span>！
        </div>
      </div>
    </div>

    <!-- 核心數據 HUD -->
    <section class="core-hud" aria-label="核心物理遙測">
      <div class="core-item">
        <div class="lbl" id="label-mass-title">引力質量</div>
        <div class="val val-white" id="massValDisplay">2.5 <small>M☉</small></div>
      </div>
      <div class="core-item">
        <div class="lbl" id="label-isco">ISCO 軌道</div>
        <div class="val val-cyan" id="iscoVal">15.0 <small>Rs</small></div>
      </div>
      <div class="core-item">
        <div class="lbl" id="label-photon">光子球臨界</div>
        <div class="val val-purple" id="photonVal">7.5 <small>Rs</small></div>
      </div>
      <div class="core-item secondary">
        <div class="lbl">都卜勒因子</div>
        <div class="val val-cyan" id="telemetryDoppler">1.42 <small>δ</small></div>
      </div>
      <div class="core-item secondary">
        <div class="lbl">引力紅移</div>
        <div class="val val-gold" id="telemetryRedshift">1.28 <small>1+z</small></div>
      </div>
    </section>

    <!-- 演化時間軸 -->
    <section class="evolution-drawer" aria-label="恆星演化歷程">
      <div class="evo-header">
        <span class="evo-title">🌌 恆星演化歷程</span>
        <span id="evolutionStageText" class="evo-stage">黑洞奇異點 (事件視界與吸積盤)</span>
      </div>
      <div id="evolutionStageDesc" class="evo-desc">
        殘餘核心質量突破歐本海默極限，核心徹底塌縮形成事件視界。
      </div>
      <input type="range" id="evolutionSlider" min="0" max="1" step="0.002" value="1.0" aria-label="演化時間軸">
      <div class="evo-actions">
        <button type="button" id="prevStageBtn">⏮ 上一階段</button>
        <button type="button" id="playPauseBtn" class="play-btn">▶ 演化播放</button>
        <button type="button" id="nextStageBtn">⏭ 下一階段</button>
      </div>
    </section>

    <!-- 底部控制區 -->
    <section class="control-row" aria-label="操控參數">
      <div class="control-group">
        <div class="ctrl-header">
          <label for="massRange" id="label-mass">質量調節</label>
          <span id="massVal" class="badge">2.5 M☉</span>
        </div>
        <input type="range" id="massRange" min="1.0" max="3.0" step="0.1" value="2.5">
      </div>

      <div class="control-group">
        <div class="ctrl-header">
          <label for="speedRange" id="label-speed">自轉速度</label>
          <span id="speedVal" class="badge">1.0 c</span>
        </div>
        <input type="range" id="speedRange" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <div class="ctrl-header">
          <label>視界狀態</label>
          <span class="badge" id="horizonState">STABLE</span>
        </div>
        <div style="font-size:0.5rem; color:#64748b; padding-top:2px;">
          r_+ = 2GM/c²
        </div>
      </div>

      <button id="launchBtn" type="button" aria-label="發射探測器">
        <div class="btn-glow"></div>
        <span id="btn-launch-text">🚀 發射探測器</span>
      </button>
    </section>
  </aside>

  <!-- CDN 依賴 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <!-- 業務模組 -->
  <script src="js/i18n.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/shaders.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/probe.js"></script>
  <script src="js/evolution.js"></script>
  <script src="js/narrative.js"></script>
  <script src="js/main.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
