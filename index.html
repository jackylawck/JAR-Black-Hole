  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./jarBlackHole192icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./jarBlackHole512icon.png">

  <!-- CSP 安全防護政策 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 三層 Parallax 視差星空背景 -->
  <div id="starfield-bg" aria-hidden="true"></div>

  <!-- 3D WebGL 渲染畫布容器 -->
  <main id="canvas-container" role="main"></main>

  <!-- 3A 旗艦級玻璃態 HUD 介面 -->
  <aside id="ui-panel" aria-label="黑洞控制終端">
    <!-- 語言切換選單 -->
    <nav class="lang-switcher" aria-label="切換語言">
      <button id="btn-zh" class="lang-btn active" type="button">繁中</button>
      <button id="btn-en" class="lang-btn" type="button">EN</button>
    </nav>

    <header>
      <h1 id="ui-title">J.A.R. 黑洞 3D</h1>
      <h2 id="ui-subtitle">廣義相對論實時模擬器</h2>
      <p id="ui-desc">觀測極限重力透鏡、時間膨脹與都卜勒聚束效應。</p>
    </header>

    <!-- 任務 HUD 條 -->
    <div class="mission-hud" role="status" aria-live="polite">
      <span class="mission-badge">OBJECTIVE</span>
      <div id="missionText" class="mission-text">任務一：光子球軌道標定 (調整質量至 3.5 M☉)</div>
    </div>

    <!-- 控制面板項 -->
    <section class="controls-wrapper" aria-label="物理與渲染參數調節">
      <div class="control-group">
        <label for="speedRange">
          <span id="label-speed">吸積盤自轉速度</span>
          <span id="speedVal" class="val-label">1.0 c</span>
        </label>
        <input type="range" id="speedRange" min="0.1" max="3.0" step="0.1" value="1.0" aria-valuemin="0.1" aria-valuemax="3.0" aria-valuenow="1.0">
      </div>

      <div class="control-group">
        <label for="massRange">
          <span id="label-mass">黑洞引力質量</span>
          <span id="massVal" class="val-label">2.5 M☉</span>
        </label>
        <input type="range" id="massRange" min="1.0" max="5.0" step="0.1" value="2.5" aria-valuemin="1.0" aria-valuemax="5.0" aria-valuenow="2.5">
      </div>

      <div class="control-group">
        <label for="bloomRange">
          <span id="label-bloom">光子球發光強度</span>
          <span id="bloomVal" class="val-label">1.6</span>
        </label>
        <input type="range" id="bloomRange" min="0.0" max="3.5" step="0.1" value="1.6" aria-valuemin="0.0" aria-valuemax="3.5" aria-valuenow="1.6">
      </div>

      <button id="launchBtn" type="button" aria-label="發射探測器觀測意粉化">
        <span id="btn-launch-text">🚀 發射探測器 (意粉化觀測)</span>
      </button>
    </section>

    <!-- 實時天體物理看板 -->
    <section class="physics-card" aria-label="物理數值看板">
      <div class="physics-card-title" id="telemetry-title">相對論遙測數據</div>
      
      <div class="stat-row">
        <span id="label-isco">最內穩定圓軌道 (ISCO)</span>
        <span id="iscoVal" class="val blue-glow">15.0 Rs</span>
      </div>
      
      <div class="stat-row">
        <span id="label-photon">光子球臨界半徑</span>
        <span id="photonVal" class="val purple-glow">7.5 Rs</span>
      </div>
      
      <div class="stat-row note" id="ui-note">
        * 當粒子穿越 ISCO (最內穩定圓軌道) 後，軌道失去穩定性直墜事件視界。
      </div>
    </section>
  </aside>

  <!-- Three.js 核心與後處理管線 (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <!-- J.A.R. 模組化業務引擎 -->
  <script src="js/i18n.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/shaders.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/probe.js"></script>
  <script src="js/main.js"></script>

  <!-- PWA Service Worker 註冊 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ PWA Service Worker 已就緒:', reg.scope))
          .catch(err => console.warn('PWA 註冊失敗:', err));
      });
    }
  </script>
</body>
</html>
